[package]
name = "add-rsi"
version = "1.0.3"
edition = "2024"
rust-version = "1.90"
authors = ["Tau Technologies"]
description = "Calculate Wilder RSI in DuckDB kline databases"
readme = "README.md"
repository = "https://github.com/tau-technologies-trading/add-rsi"
homepage = "https://github.com/tau-technologies-trading/add-rsi"
license = "MIT"
keywords = ["rsi", "binance", "duckdb", "trading", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"

[target.'cfg(not(windows))'.dependencies]
duckdb = { version = "1.10504", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
duckdb = "1.10504"
